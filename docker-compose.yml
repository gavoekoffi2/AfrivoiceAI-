version: "3.8"

services:
  # Application Next.js
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: afrivoice-ai-web:latest
    container_name: afrivoice-ai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      VAPI_API_KEY: ${VAPI_API_KEY}
      VAPI_PUBLIC_KEY: ${VAPI_PUBLIC_KEY}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      EXCHANGE_RATE_USD_TO_FCFA: ${EXCHANGE_RATE_USD_TO_FCFA:-600}
      PROFIT_MARGIN_PERCENTAGE: ${PROFIT_MARGIN_PERCENTAGE:-30}
    depends_on:
      - db
    networks:
      - afrivoice-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Base de données PostgreSQL locale (alternative à Supabase Cloud)
  db:
    image: postgres:16-alpine
    container_name: afrivoice-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-afrivoice}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/supabase/migrations/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - afrivoice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reverse proxy Nginx avec SSL
  nginx:
    image: nginx:alpine
    container_name: afrivoice-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
    networks:
      - afrivoice-network

volumes:
  postgres_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  afrivoice-network:
    driver: bridge
